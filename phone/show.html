<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eLlama display</title>
<style>html,body{margin:0;height:100%;background:#000}img{width:100%;height:100%;object-fit:contain;display:block}</style>
<img id="i" alt="">
<script>
// Shows show.jpg full screen and checks for a new frame ~12x/s; the file is replaced from the computer.
const img = document.getElementById('i');
let last = '';
async function tick() {
  try {
    const r = await fetch('show.jpg', {cache: 'no-store'});
    if (r.ok) {
      const tag = r.headers.get('last-modified') + r.headers.get('content-length');
      if (tag !== last) { last = tag; img.src = URL.createObjectURL(await r.blob()); }
    }
  } catch (e) {}
  setTimeout(tick, 80);
}
tick();
</script>
